name: AI chatbot backend quality

on:
  pull_request:
    paths:
      - "ai-chatbot-backend/**"
      - ".github/workflows/ai-chatbot-quality.yml"
  push:
    branches: [main]
    paths:
      - "ai-chatbot-backend/**"
      - ".github/workflows/ai-chatbot-quality.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatbot_test
          POSTGRES_PASSWORD: chatbot_test_password
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot_test -d chatbot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CHATBOT_INTEGRATION_DATABASE_URL: postgresql+asyncpg://chatbot_test:chatbot_test_password@127.0.0.1:5432/chatbot_test
      CHATBOT_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: ai-chatbot-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-chatbot-backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
