services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vcare
      POSTGRES_PASSWORD: vcare_local_dev_only
      POSTGRES_DB: vcare
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcare -d vcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vcare-postgres-data:/var/lib/postgresql/data

volumes:
  vcare-postgres-data:
